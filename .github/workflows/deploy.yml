name: Deploy

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Configure SSH
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_PORT: ${{ secrets.DEPLOY_PORT }}
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
        run: |
          set -euo pipefail
          mkdir -p ~/.ssh
          python - <<'PY'
          from os import environ
          from pathlib import Path

          key = environ["DEPLOY_SSH_KEY"].strip()
          if key.startswith('"') and key.endswith('"'):
              key = key[1:-1]
          key = key.replace("\\r", "").replace("\\n", "\n")
          if not key.endswith("\n"):
              key += "\n"
          Path.home().joinpath(".ssh", "deploy_key").write_text(key)
          PY
          chmod 600 ~/.ssh/deploy_key
          PORT="${DEPLOY_PORT:-22}"
          echo "DEPLOY_PORT_RESOLVED=${PORT}" >> "$GITHUB_ENV"
          ssh-keyscan -p "$PORT" -H "$DEPLOY_HOST" >> ~/.ssh/known_hosts

      - name: Deploy
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_PATH: ${{ secrets.DEPLOY_PATH }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
        run: |
          set -euo pipefail
          ssh -i ~/.ssh/deploy_key -o IdentitiesOnly=yes -p "${DEPLOY_PORT_RESOLVED}" "${DEPLOY_USER}@${DEPLOY_HOST}" <<EOF
            set -euo pipefail
            cd "${DEPLOY_PATH}"

            git fetch origin main
            git reset --hard origin/main

            docker compose -f docker-compose.prod.yml --env-file .env.prod up -d --build --remove-orphans
            docker compose -f docker-compose.prod.yml --env-file .env.prod ps
          EOF
